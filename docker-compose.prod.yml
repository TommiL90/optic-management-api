services:
  # ============================================
  # PostgreSQL Database (Ultra-Optimizado para 512MB RAM VPS)
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: optic-db
    restart: unless-stopped

    # Límites de recursos CRÍTICOS (150MB max)
    deploy:
      resources:
        limits:
          cpus: '0.3'        # 30% de 1 core
          memory: 150M       # Máximo absoluto
        reservations:
          cpus: '0.15'       # 15% reservado
          memory: 128M       # 128MB reservados

    # Variables de entorno
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-optic_db}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata

    # Configuración PostgreSQL ultra-optimizada para 1 usuario
    command: >
      postgres
      -c max_connections=5
      -c shared_buffers=32MB
      -c effective_cache_size=64MB
      -c maintenance_work_mem=16MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=8MB
      -c default_statistics_target=50
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2MB
      -c min_wal_size=32MB
      -c max_wal_size=64MB
      -c log_statement=none
      -c log_duration=off
      -c logging_collector=off
      -c log_connections=off
      -c log_disconnections=off
      -c log_hostname=off
      -c fsync=on
      -c synchronous_commit=on
      -c full_page_writes=on

    # Volumen persistente
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Health check ligero
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optic_user} -d ${POSTGRES_DB:-optic_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    # Red privada interna
    networks:
      - optic_network

  # ============================================
  # API Node.js (Fastify)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: optic-api
    restart: unless-stopped

    # Límites de recursos CRÍTICOS (128MB max)
    deploy:
      resources:
        limits:
          cpus: '0.3'        # 30% de 1 core
          memory: 128M       # Máximo absoluto
        reservations:
          cpus: '0.15'       # 15% reservado
          memory: 100M       # 100MB reservados

    # Variables de entorno (desde .env)
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      LOG_PRETTY: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-optic_user}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-optic_db}?schema=public&connection_limit=3&pool_timeout=20

      # Limitar heap de Node.js (crítico para evitar OOM)
      NODE_OPTIONS: "--max-old-space-size=96"

    # Puertos (solo interno, Traefik expone externamente)
    ports:
      - "${API_PORT:-9876}:3000"

    # Depende de PostgreSQL
    depends_on:
      db:
        condition: service_healthy

    # Health check (sobrescribe el del Dockerfile para mayor control)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Red privada interna
    networks:
      - optic_network

# ============================================
# Volúmenes Persistentes
# ============================================
volumes:
  postgres_data:
    driver: local
    name: optic_postgres_data

# ============================================
# Redes Internas
# ============================================
networks:
  optic_network:
    driver: bridge
    name: optic_network
